[package]
name = "dungeon_manager"
version = "0.1.0"
edition = "2021"
authors = ["Deep Dominion Team"]
default-run = "dungeon_manager"

[dependencies]
macroquad = "0.4"
macroquad-toolkit = { path = "../macroquad-toolkit" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
image = "0.24"

[profile.release]
opt-level = 3
lto = true

[[bin]]
name = "dungeon_manager"
path = "src/main.rs"

[[bin]]
name = "build_graphics"
path = "build_graphics.rs"
